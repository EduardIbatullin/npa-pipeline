[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "npa-pipeline"
version = "0.1.0"
description = "Поиск и скачивание официальных НПА с publication.pravo.gov.ru"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
npa = "npa_pipeline.cli:main"
npa-web = "npa_pipeline.webapp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
npa_pipeline = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: тесты против живого API publication.pravo.gov.ru (сеть обязательна)",
]
addopts = "-m \"not live\""
