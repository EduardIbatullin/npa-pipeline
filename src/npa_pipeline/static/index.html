<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NPA Pipeline — проверка API</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="page page-check">
    <header class="header header-centered">
      <p class="eyebrow">Проверка API</p>
      <h1>NPA Pipeline</h1>
      <p class="lede">Поиск НПА или ИТС/НДТ по названию · скачивание через тот же API, что CLI</p>
    </header>

    <main class="layout layout-single">
      <div class="status-box status-box-block" id="health">
        <span class="dot"></span>
        <span id="health-text">проверка…</span>
      </div>

      <section class="panel">
        <form id="lookup-form" class="form">
          <label>
            Наименование НПА / ИТС
            <span class="hint">полное название акта или обозначение вроде «ИТС 28-2021»</span>
            <textarea
              id="query"
              name="q"
              rows="3"
              required
              placeholder='Федеральный закон от 21.07.2014 № 219-ФЗ&#10;или: ИТС 28-2021'
            ></textarea>
          </label>
          <div class="actions">
            <button type="submit" class="btn primary" id="btn-lookup">Найти</button>
          </div>
        </form>
      </section>

      <section class="panel">
        <h2>Результат</h2>
        <div id="result" class="result empty">Введите название и нажмите «Найти».</div>
      </section>
    </main>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
